<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
	<rect width="600" height="400" fill="#1f3fd6"/>

	<!-- triangle: pink, top-left -->
	<g transform="translate(60,50) rotate(-12)">
		<polygon points="0,0 46,0 23,42" fill="#ff2d95" stroke="#12123a" stroke-width="5" stroke-linejoin="round"/>
	</g>

	<!-- lightning bolt: yellow -->
	<g transform="translate(175,35) rotate(6) scale(0.9)">
		<path d="M30,0 L4,42 L22,42 L0,88 L46,38 L26,38 Z" fill="#ffd23f" stroke="#12123a" stroke-width="5" stroke-linejoin="round"/>
	</g>

	<!-- spiral: pink -->
	<g transform="translate(300,55)">
		<path d="M0,10 C0,-6 18,-6 18,10 C18,24 2,24 2,12 C2,2 12,2 12,10" fill="none" stroke="#ff6fb5" stroke-width="5" stroke-linecap="round"/>
	</g>

	<!-- chevron: teal -->
	<g transform="translate(390,40)">
		<polyline points="0,0 20,20 0,40" fill="none" stroke="#00c9c8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<!-- small triangle: teal, top-right -->
	<g transform="translate(495,60) rotate(25)">
		<polygon points="0,0 34,0 17,30" fill="#00c9c8" stroke="#12123a" stroke-width="4" stroke-linejoin="round"/>
	</g>

	<!-- music note: cream -->
	<g transform="translate(70,150)">
		<ellipse cx="0" cy="34" rx="8" ry="6" fill="#fff8ec" stroke="#12123a" stroke-width="3" transform="rotate(-15 0 34)"/>
		<rect x="6" y="0" width="4" height="36" fill="#fff8ec" stroke="#12123a" stroke-width="2"/>
		<path d="M10,0 C24,4 26,16 10,20" fill="#fff8ec" stroke="#12123a" stroke-width="3"/>
	</g>

	<!-- dash bar: pink -->
	<g transform="translate(155,210) rotate(-22)">
		<rect x="0" y="0" width="54" height="10" rx="5" fill="#ff2d95" stroke="#12123a" stroke-width="3"/>
	</g>

	<!-- triangle: purple -->
	<g transform="translate(250,190) rotate(8)">
		<polygon points="0,0 44,0 22,40" fill="#7b2ff7" stroke="#12123a" stroke-width="5" stroke-linejoin="round"/>
	</g>

	<!-- lightning bolt: small yellow -->
	<g transform="translate(355,230) rotate(-8) scale(0.65)">
		<path d="M30,0 L4,42 L22,42 L0,88 L46,38 L26,38 Z" fill="#ffd23f" stroke="#12123a" stroke-width="6" stroke-linejoin="round"/>
	</g>

	<!-- spiral: teal -->
	<g transform="translate(460,190)">
		<path d="M0,10 C0,-6 18,-6 18,10 C18,24 2,24 2,12 C2,2 12,2 12,10" fill="none" stroke="#5eeeed" stroke-width="5" stroke-linecap="round"/>
	</g>

	<!-- chevron: pink, bottom-left -->
	<g transform="translate(60,320)">
		<polyline points="20,0 0,20 20,40" fill="none" stroke="#ff2d95" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<!-- triangle: purple, bottom -->
	<g transform="translate(165,345) rotate(-6)">
		<polygon points="0,0 40,0 20,-36" fill="#7b2ff7" stroke="#12123a" stroke-width="5" stroke-linejoin="round"/>
	</g>

	<!-- dash bar: teal -->
	<g transform="translate(275,335) rotate(16)">
		<rect x="0" y="0" width="54" height="10" rx="5" fill="#00c9c8" stroke="#12123a" stroke-width="3"/>
	</g>

	<!-- small triangle: teal, bottom-right -->
	<g transform="translate(410,340) rotate(-18)">
		<polygon points="0,0 34,0 17,30" fill="#00c9c8" stroke="#12123a" stroke-width="4" stroke-linejoin="round"/>
	</g>

	<!-- chevron: purple, bottom-right -->
	<g transform="translate(530,300)">
		<polyline points="0,0 20,20 0,40" fill="none" stroke="#7b2ff7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
	</g>

	<!-- small dot cluster -->
	<circle cx="230" cy="120" r="5" fill="#fff8ec"/>
	<circle cx="245" cy="135" r="5" fill="#fff8ec"/>
	<circle cx="530" cy="140" r="6" fill="#ff2d95" stroke="#12123a" stroke-width="2"/>
	<circle cx="20" cy="250" r="6" fill="#ffd23f" stroke="#12123a" stroke-width="2"/>
</svg>
