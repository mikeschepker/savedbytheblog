<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script>
	(function () {
		try {
			var t = localStorage.getItem('sbtb-theme');
			if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
		} catch (e) {}
	})();
	</script>
	<title>{{ .Title }}{{ if ne .Title .Site.Title }} // {{ .Site.Title }}{{ end }}</title>

	{{ with .Site.Params.author.avatar }}
		<link rel="icon" href="{{ . }}">
		<link rel="apple-touch-icon" href="{{ . }}">
	{{ end }}

	{{ partial "meta.html" . }}
	{{ partial "og.html" . }}

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="{{ "css/style.css" | absURL }}?{{ .Site.Params.theme_seconds }}">

	{{ partial "microblog_head.html" . }}

	{{ with .Site.Params.umami_website_id }}
		<script defer src="{{ or $.Site.Params.umami_url "https://cloud.umami.is/script.js" }}" data-website-id="{{ . }}"></script>
	{{ end }}

	{{ with .Site.Params.custom_head_html }}
		{{ . | safeHTML }}
	{{ end }}
</head>
