{{ $pag := .Paginator }}
{{ if or $pag.HasPrev $pag.HasNext }}
<nav class="page-nav" aria-label="Pagination">
	{{ if $pag.HasPrev }}
		<a class="page-nav-prev" href="{{ $pag.Prev.URL }}">&#10216; Newer</a>
	{{ end }}
	{{ if $pag.HasNext }}
		<a class="page-nav-next" href="{{ $pag.Next.URL }}">Older &#10217;</a>
	{{ end }}
</nav>
{{ end }}
