{{ define "main" }}
	<h1 class="section-title">{{ .Title }}</h1>
	<ul class="term-cloud">
		{{ $site := .Site }}
		{{ $data := .Data }}
		{{ range $key, $value := .Data.Terms.Alphabetical }}
			<li><a href="{{ $site.LanguagePrefix }}/{{ $data.Plural }}/{{ $value.Name | urlize }}">{{ $value.Name }}</a> <span class="term-count">{{ $value.Count }}</span></li>
		{{ end }}
	</ul>
{{ end }}
