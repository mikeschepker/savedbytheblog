<!DOCTYPE html>
<html lang="{{ or .Site.LanguageCode "en" }}">
{{ partial "head.html" . }}
<body>
	<a class="skip-link" href="#main-content">Skip to content</a>
	{{ partial "header.html" . }}
	<div class="wrap" id="main-content">
		{{ block "main" . }}{{ end }}
	</div>
	{{ partial "footer.html" . }}
	{{ partial "custom_footer.html" . }}
	{{ range .Site.Params.plugins_js }}
		<script src="{{ . }}"></script>
	{{ end }}
</body>
</html>
