{{ define "main" }}
	<h1 class="section-title">Posted in: {{ .Title }}</h1>
	<div class="post-list h-feed">
		{{ $paginator := .Paginate .Pages (or .Site.Params.posts_per_page 10) }}
		{{ range $paginator.Pages }}
			{{ partial "li.html" . }}
		{{ end }}
	</div>
	{{ partial "pagination.html" . }}
{{ end }}
